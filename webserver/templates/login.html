<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="text" placeholder="Username" name="username" required>
        <input type="password" placeholder="Password" name="password" required>

        <button type="submit">Login</button>
    </form>

</body>
</html>
